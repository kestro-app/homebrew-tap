name: audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # On installe le tap depuis *ce* commit, et non depuis GitHub : sur une
      # pull request, tapper le dépôt distant auditerait main et laisserait
      # passer précisément ce qu'on cherche à vérifier.
      - name: Poser le tap depuis ce commit
        run: |
          TAP="$(brew --repository)/Library/Taps/kestro-app/homebrew-tap"
          rm -rf "$TAP"
          mkdir -p "$(dirname "$TAP")"
          cp -R "$GITHUB_WORKSPACE" "$TAP"

      - name: Style
        run: brew style --cask kestro-app/tap/kestro

      # --online télécharge les DMG et vérifie les empreintes : c'est le seul
      # contrôle qui attrape une URL morte ou un sha256 qui ne correspond plus.
      #
      # Un seul reproche est toléré, et il est extérieur au cask : la racine de
      # kestro.fr rend volontairement 404 tant que le site n'est pas ouvert au
      # public. Le laisser faire échouer la CI la rendrait rouge en permanence
      # — c'est-à-dire muette le jour où un vrai problème apparaîtra. La
      # tolérance disparaîtra d'elle-même à l'ouverture du site.
      - name: Audit
        run: |
          set +e
          brew audit --cask --strict --online kestro-app/tap/kestro > audit.log 2>&1
          statut=$?
          set -e
          cat audit.log
          [ $statut -eq 0 ] && exit 0

          problemes=$(grep -E '^[[:space:]]+\*[[:space:]]' audit.log || true)
          restants=$(printf '%s\n' "$problemes" | grep -v 'homepage URL' | grep -v '^$' || true)

          if [ -n "$problemes" ] && [ -z "$restants" ]; then
            echo "::warning::homepage injoignable — kestro.fr est encore sous rideau"
            exit 0
          fi
          exit 1
